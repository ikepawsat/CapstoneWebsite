{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="container">
  <h1>Interactive Tableau Dashboard</h1>

  <div class="tableauPlaceholder" id="vizDashboard" style="position: relative">
    <noscript>
      <a href="#">
        <img alt="Dashboard 2"
            src="https://public.tableau.com/static/images/DS/DS_BM/Dashboard2/1_rss.png"
            style="border: none" />
      </a>
    </noscript>

    <object class="tableauViz" style="display:none;">
      <param name="host_url" value="https%3A%2F%2Fpublic.tableau.com%2F" />
      <param name="embed_code_version" value="3" />
      <param name="site_root" value="" />
      <param name="name" value="DS_BM/Dashboard2" />
      <param name="tabs" value="no" />
      <param name="toolbar" value="yes" />
      <param name="static_image"
            value="https://public.tableau.com/static/images/DS/DS_BM/Dashboard2/1.png" />
      <param name="animate_transition" value="yes" />
      <param name="display_static_image" value="yes" />
      <param name="display_spinner" value="yes" />
      <param name="display_overlay" value="yes" />
      <param name="display_count" value="yes" />
      <param name="language" value="en-US" />
      <param name="filter" value="publish=yes" />
    </object>
  </div>
</div>

<script type="text/javascript">
  var divElement = document.getElementById('vizDashboard');
  var vizElement = divElement.getElementsByTagName('object')[0];

  // Force full-width responsive Tableau viz
  function resizeViz() {
      var width = divElement.offsetWidth;

      // Always take full width
      vizElement.style.width = "100%";

      // Responsive height (adjust the multiplier if needed)
      vizElement.style.height = (width * 0.65) + "px";
  }

  // Initial load
  resizeViz();

  // Resize on window change
  window.addEventListener("resize", resizeViz);

  // Load Tableau script
  var scriptElement = document.createElement("script");
  scriptElement.src = "https://public.tableau.com/javascripts/api/viz_v1.js";
  vizElement.parentNode.insertBefore(scriptElement, vizElement);
</script>

{% endblock %}
